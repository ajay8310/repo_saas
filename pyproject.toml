[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "repo-saas"
version = "0.1.0"
description = "Generic Multi-Tenant SaaS Document and Credential Repository Platform"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    # Cache / Queue
    "redis==5.0.4",
    "celery[redis]==5.4.0",
    # AWS
    "boto3==1.34.102",
    "botocore==1.34.102",
    # Auth / Crypto
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "pyotp==2.9.0",
    "cryptography==42.0.7",
    # Document generation
    "reportlab==4.2.0",
    "weasyprint==62.3",
    "pyld==2.0.4",
    "qrcode[pil]==7.4.2",
    "Pillow==10.3.0",
    # Validation
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "email-validator==2.1.1",
    # HTTP client (for webhooks, DigiLocker)
    "httpx==0.27.0",
    # ClamAV
    "clamd==1.0.2",
    # Utilities
    "python-multipart==0.0.9",
    "python-dateutil==2.9.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-mock==3.14.0",
    "pytest-cov==5.0.0",
    "anyio==4.3.0",
    "httpx==0.27.0",
    # Property-based testing
    "hypothesis==6.100.2",
    # Linting / formatting
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (require Docker Compose)",
    "smoke: marks tests as smoke tests (run post-deployment)",
    "unit: marks tests as unit tests",
    "property: marks tests as property-based tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

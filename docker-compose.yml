version: "3.9"

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reposaaas
      POSTGRES_PASSWORD: reposaaas
      POSTGRES_DB: reposaaas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reposaaas"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,kms,ses,sns
      DEFAULT_REGION: ap-south-1
    volumes:
      - localstack_data:/var/lib/localstack

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"

  # ---------- Application ----------
  api:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://reposaaas:reposaaas@postgres:5432/reposaaas
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://localstack:4566
      KMS_ENDPOINT_URL: http://localstack:4566
      SES_ENDPOINT_URL: http://localstack:4566
      SNS_ENDPOINT_URL: http://localstack:4566
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://reposaaas:reposaaas@postgres:5432/reposaaas
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://localstack:4566
      KMS_ENDPOINT_URL: http://localstack:4566
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      target: beat
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # ---------- Frontend (Vite dev server with hot-reload) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount source for hot-reload...
      - ./frontend:/app
      # ...but keep the container's node_modules (installed for Linux).
      - /app/node_modules
    environment:
      # Vite proxies /api to this target. Inside the compose network the API
      # is reachable by its service name.
      VITE_API_TARGET: http://api:8000
      # Poll for file changes — reliable for bind mounts on Windows/WSL.
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api

  # ---------- Migrations ----------
  migrate:
    build:
      context: .
      target: base
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://reposaaas:reposaaas@postgres:5432/reposaaas
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  pgdata:
  localstack_data:

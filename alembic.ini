# Alembic configuration file
# Full docs: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names.
# Tokens: %%(rev)s  %%(slug)s  %%(year)d  %%(month).2d  %%(day).2d
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# The timezone to use when rendering the date within the migration file
# as well as the filename. Defaults to UTC.
timezone = UTC

# Maximum length of characters to apply to the "slug" field
truncate_slug_length = 40

# Version locations (comma-separated when multiple heads are used)
version_locations = %(here)s/alembic/versions

# The output encoding used when revision files are written.
output_encoding = utf-8

# DATABASE_URL is read from the environment by env.py
# sqlalchemy.url is intentionally left blank here.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured by default.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

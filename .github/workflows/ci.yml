name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
  REDIS_URL: "redis://localhost:6379/0"
  S3_BUCKET_NAME: "test-bucket"
  JWT_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nPLACEHOLDER\n-----END RSA PRIVATE KEY-----"
  JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nPLACEHOLDER\n-----END PUBLIC KEY-----"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install ruff mypy
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=app --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml

  test-property:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run property tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest tests/property/ -v --tb=short

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m integration

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-property]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --target production -t repo-saas:${{ github.sha }} .
      - name: Verify image starts
        run: |
          docker run -d --name test-api \
            -e DATABASE_URL=${{ env.DATABASE_URL }} \
            -e REDIS_URL=${{ env.REDIS_URL }} \
            -e S3_BUCKET_NAME=${{ env.S3_BUCKET_NAME }} \
            -e JWT_PRIVATE_KEY="${{ env.JWT_PRIVATE_KEY }}" \
            -e JWT_PUBLIC_KEY="${{ env.JWT_PUBLIC_KEY }}" \
            repo-saas:${{ github.sha }}
          sleep 5
          docker logs test-api
          docker stop test-api
